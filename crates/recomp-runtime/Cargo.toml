[package]
name = "recomp-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
recomp-abi = { path = "../recomp-abi" }
recomp-gfx = { path = "../recomp-gfx" }
recomp-services = { path = "../recomp-services" }
recomp-simd = { path = "../recomp-simd" }
recomp-timing = { path = "../recomp-timing" }
libc = "0.2"
rhai = { version = "1.21", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(recomp_fast_tls)"] }
